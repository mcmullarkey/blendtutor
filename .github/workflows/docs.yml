name: Docs

# Build the combined documentation site — mdBook narrative + rustdoc API — and
# deploy it to GitHub Pages. It runs on the default branch (main) and on the
# staging/rewrite-in-rust-lol integration branch, so the published docs track the
# Rust rewrite as it lands on staging instead of waiting for the merge to main.
# The rustdoc output is nested under the book at /api, so a single artifact serves
# both the prose (at /) and the API reference (at /api). scripts/check-docs.sh
# runs the same build + assemble locally.
#
# The github-pages environment's deployment-branch-policy must also list any
# branch named here, or the deploy job is blocked at the environment gate.
on:
  push:
    branches: [main, staging/rewrite-in-rust-lol]
  workflow_dispatch:

# Least privilege at the workflow level: only checkout is needed by default. The
# Pages OIDC grants (pages:write + id-token:write) belong solely to the deploy
# job, so they are scoped there rather than handed to the build job too.
permissions:
  contents: read

# One Pages deploy at a time, and never cancel an in-flight deploy — a cancelled
# deploy can leave the live site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Any rustdoc warning (broken intra-doc link, undocumented item) fails the
  # build, so the published API reference cannot silently rot (AC2).
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: build site (mdBook + rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml is the single source of truth for the toolchain
      # (channel + components); rustup installs it on first cargo use. See ci.yml.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # API reference → target/doc. --no-deps keeps it to this workspace's crates;
      # RUSTDOCFLAGS (above) makes any warning fatal.
      - name: Build API docs (rustdoc)
        run: cargo doc --no-deps

      # Narrative site → docs/book/book, with client-side search (book.toml).
      - name: Build narrative docs (mdBook)
        run: mdbook build docs/book

      # Merge: nest the rustdoc tree under the book output at /api so one artifact
      # serves the book at / and the API reference at /api. Mirrors check-docs.sh.
      - name: Assemble merged site
        run: |
          rm -rf docs/book/book/api
          cp -R target/doc docs/book/book/api

      # AC-6 (#76) — build example course sites (webr + pyodide) into the Pages
      # artifact so the deployed docs include live, runnable example lessons.
      # Each site nests under /examples/{r,python}/, mirroring the /api nesting.
      - name: Build R example site (webR)
        run: cargo run --release -p blendtutor-cli -- build examples/write-less-code-r --target webr -o docs/book/book/examples/r

      - name: Build Python example site (Pyodide)
        run: cargo run --release -p blendtutor-cli -- build examples/write-less-code-python --target pyodide -o docs/book/book/examples/python

      # AC-2 (#152) — deploy demo-book + demo-standalone into the Pages
      # artifact at /demo-book/ + /demo/, mirroring the /api + /examples nesting.
      # Quarto is not installed on this runner until setup@v2 runs, and the
      # demo-book renders into demo-book/_output/ (demo-book/_quarto.yml pins
      # output-dir: _output), so the copy must DOT-COPY (trailing /.): a bare
      # cp -R demo-book/_output dst would add a demo-book/_output/ layer and
      # /demo-book/ would 404. demo-standalone renders beside its source, so the
      # copy is SELECTIVE (index.html + index_files/ + coi-serviceworker.js) to
      # keep .qmd sources/_quarto.yml/_extensions/ out of the public artifact.
      # The COI scope post-process runs after render, before copy, so the page
      # serves ./coi-serviceworker.js at page root (SW scope covers the page).
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render demo-book (Quarto)
        run: quarto render demo-book --to html

      - name: Render demo-standalone (Quarto)
        run: quarto render demo-standalone --to html

      - name: Fix COI service-worker scope (demo-standalone)
        run: bash scripts/fix-demo-coi-scope.sh demo-standalone

      - name: Assemble demo-book into artifact (/demo-book/)
        run: |
          mkdir -p docs/book/book/demo-book
          cp -R demo-book/_output/. docs/book/book/demo-book/

      - name: Assemble demo-standalone into artifact (/demo/)
        run: |
          mkdir -p docs/book/book/demo
          cp demo-standalone/index.html docs/book/book/demo/
          cp -R demo-standalone/index_files docs/book/book/demo/
          cp demo-standalone/coi-serviceworker.js docs/book/book/demo/

      - name: Add .nojekyll at artifact root
        run: touch docs/book/book/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Job-level outputs: the built site URL. deploy-pages publishes and emits
    # the live URL via the step id; job-level outputs are the ONLY way to pass
    # it across job boundaries (step outputs do NOT survive needs:), so the
    # verify-live alarm job can build DEPLOYED_URL from it (AC-4).
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Job-level permissions replace the workflow defaults: the Pages deploy needs
    # the OIDC token write + pages write, and nothing else (it consumes the
    # artifact the build job uploaded; it does not check out the repo).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Post-deploy alarm — runs AC-3 probe against live URL; failure is NOT a gate
  # (deploy already published).
  verify-live:
    name: verify live demo (AC-3 probe)
    needs: deploy
    runs-on: ubuntu-latest
    # Probe wall-time ~4.5min (COI 30s + webR 120s + pyodide 60s); the alarm
    # must outlive the probe so a slow-but-healthy site is not killed mid-run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # uvx rodney (pinned rodney==0.4.0 in pages-live.js) requires uv.
      - uses: astral-sh/setup-uv@v5

      # Defensive node pin over the ubuntu-latest default.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # AC-3 probe against the LIVE URL: DEPLOYED_URL = Pages site root
      # (needs.deploy.outputs.page_url, trailing slash) + demo/ nest. The
      # harness (pages-live.js) sets ROD_CHROME_BIN to scripts/rodney-chrome.sh
      # itself, so the committed wrapper strips rodney 0.4.0's isolation-
      # breaking Chrome flags. No continue-on-error / || true / if: always():
      # a probe failure FAILS this job — that is the alarm.
      - name: Verify live demo (rodney COI probe)
        run: DEPLOYED_URL="${{ needs.deploy.outputs.page_url }}demo/" uv run node rodney-probes/pages-live.js live
