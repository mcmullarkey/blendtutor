# Eval suite for 03_write_a_function.
#
# Hand-written anchor set (cases 1-4) plus items generated with the
# blendtutor-course skill's "Generate more items" workflow (source: generated):
# one blueprint misconception per incorrect item, varied in names, idioms, and
# formatting, plus correct items that use unusual but valid idioms. Generated
# by Claude; the grader under test is DeepSeek on Fireworks (different family).
blueprint:
  misconceptions:
    M1: "uses the wrong scale maximum (e.g. 5 - x or 7 - x)"
    M2: "returns the input unchanged"
    M3: "function body has no final expression, so it returns NULL"
    M4: "hard-codes the expected output instead of computing it"
    M5: "ignores the argument and reads a survey_data column instead"
    M6: "prints or cats the result instead of returning it"
    M7: "reverses the order of the vector instead of reverse-scoring it"
    M8: "names the function something other than reverse_score"
cases:
  # 1 - hand, correct: standard reverse_score
  - submission: |-
      survey_data <- data.frame(
        respondent_id = 1:5,
        stress_1 = c(3, 4, 5, 2, 1),
        stress_2 = c(2, 3, 4, 5, 1),
        stress_3 = c(1, 2, 3, 4, 5),
        stress_4 = c(5, 4, 3, 2, 1),
        stress_5 = c(4, 3, 2, 1, 5),
        stress_6 = c(1, 2, 3, 4, 5)
      )
      reverse_score <- function(x) 6 - x
    expected: correct
  # 2 - hand, correct: explicit return
  - submission: |-
      survey_data <- data.frame(
        respondent_id = 1:5,
        stress_1 = c(3, 4, 5, 2, 1),
        stress_2 = c(2, 3, 4, 5, 1),
        stress_3 = c(1, 2, 3, 4, 5),
        stress_4 = c(5, 4, 3, 2, 1),
        stress_5 = c(4, 3, 2, 1, 5),
        stress_6 = c(1, 2, 3, 4, 5)
      )
      reverse_score <- function(x) {
        return(6 - x)
      }
    expected: correct
  # 3 - hand, incorrect: wrong max_value
  - submission: |-
      survey_data <- data.frame(
        respondent_id = 1:5,
        stress_1 = c(3, 4, 5, 2, 1),
        stress_2 = c(2, 3, 4, 5, 1),
        stress_3 = c(1, 2, 3, 4, 5),
        stress_4 = c(5, 4, 3, 2, 1),
        stress_5 = c(4, 3, 2, 1, 5),
        stress_6 = c(1, 2, 3, 4, 5)
      )
      reverse_score <- function(x) 5 - x
    expected: incorrect
    misconception: M1
  # 4 - hand, incorrect: returns x unchanged
