lesson_name: "Eval Compare Candidate"
language: R
description: "Candidate grading prompt for eval-compare"

exercise:
  type: "function_writing"
  prompt: |
    Write a function called 'add_two' that takes two numeric arguments
    (x and y) and returns their sum.
  code_template: |
    add_two <- function(x, y) {

    }
  solution: |
    add_two <- function(x, y) {
      x + y
    }
  success_criteria: |
    - PROMPT_V2: returns the sum of x and y
    - Feedback should guide the learner without giving a working solution
  llm_evaluation_prompt: |
    Evaluate the student's submission:
    {student_code}
    Reply with feedback.

checks:
  - "stopifnot(add_two(2, 3) == 5)"
  - "stopifnot(add_two(-1, 1) == 0)"
